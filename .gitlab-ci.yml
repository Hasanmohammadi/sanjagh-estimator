stages:
  - build

frontend-build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t painting-estimator-frontend ./frontend

backend-build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t painting-estimator-backend ./backend